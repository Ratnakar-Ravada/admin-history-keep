openapi: 3.1.0
info:
  title: Location Keeper API
  version: 1.3.0
  description: >-
    Verified Google sign-in with automatically remembered, revocable app sessions.
    Ordinary viewers discover non-revoked devices whose registered tracking_email
    matches their normalized Google email and unlock each device with its existing
    four-digit PIN before reading any device history. The mobile registration
    contract uses a primary Gmail address; the dashboard does not canonicalize
    Gmail aliases, dots or plus suffixes. The current app_users.is_advanced flag
    grants all-device history without a PIN and Analytics access. Google environment
    administrator lists control only Gmail sender management; legacy assigned-user
    grants do not authorize devices. Coordinates are private. Tracking tables are
    SELECT-only; app-owned session and unlock state is written separately. No
    alert monitoring, PIN enrollment or OTP/forgot-PIN endpoint is provided.
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /healthz:
    get:
      security: []
      responses:
        "200":
          {
            description: "Process is responding; no sensitive configuration is returned.",
          }
  /api/session:
    get:
      security: []
      responses:
        "200":
          description: Authentication status, safe Google viewer identity (subject, app user_id, name, email and current database is_advanced flag), analytics_enabled, demo flag, current UTC time, public map style and filter options. An unauthenticated result contains no device information. A valid session may renew its encrypted HTTP-only cookie at the daily threshold. Neither session tokens nor device unlock secrets are returned.
        "503": { description: Durable session verification is temporarily unavailable; authentication fails closed. }
  /auth/login:
    get:
      security: []
      responses:
        "302":
          {
            description: "Google sign-in authorization-code flow with PKCE, state, nonce and account selection.",
          }
  /auth/callback:
    get:
      security: []
      responses:
        "303":
          {
            description: "Validate state, code, nonce, issuer, audience, token expiry and verified email; upsert the app user and automatically create a remembered app session with a 400-day inactivity lifetime. Set an encrypted HTTP-only SameSite=Lax cookie (Secure on HTTPS), renewed at most daily during use, or return to sign-in failure. The app session can outlive the original Google token; ordinary sign-in retains no Google tokens.",
          }
  /auth/logout:
    post:
      description: Requires a same-origin request. Durably revokes the saved app session, ends its remembered device unlocks and clears the application session cookie. A copied cookie cannot continue that session.
      responses:
        "200": { description: "Signed out." }
  /api/email/status:
    get:
      description: Administrator-only sender configuration and saved-connection status. No OAuth tokens are returned. Automated alerts remain disabled.
      responses:
        "200":
          {
            description: "Sender enabled/connected/can_connect flags, configured sender email and capabilities.",
          }
        "403": { description: "Administrator access required." }
  /api/email/connect:
    post:
      description: Same-origin administrator action. Signed-in account must match GMAIL_SENDER_EMAIL. Starts separate Gmail send and offline-access consent.
      responses:
        "200":
          {
            description: "Google authorization_url; encrypted flow cookie is set.",
          }
        "403": { description: "Account or origin rejected." }
        "409":
          {
            description: "Gmail connection is not configured or demo is active.",
          }
  /auth/gmail/callback:
    get:
      description: Checks signed-in sender, PKCE, state, nonce, verified Google identity, granted gmail.send scope and refresh token. Saves encrypted server-side credentials; sends no message.
      responses:
        "303":
          { description: "Returns to Alerts with connected or failed status." }
  /api/email/disconnect:
    post:
      description: Same-origin administrator action by the configured sender. Deletes local credentials without revoking the Google project's other grants.
      responses:
        "200": { description: "Local sender disconnected." }
        "403": { description: "Account or origin rejected." }
  /api/usage/heartbeat:
    post:
      description: Same-origin authenticated heartbeat. Active means recent input on a visible page; it is an advisory activity estimate. This API call is classified as background.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [active]
              properties:
                active: { type: boolean }
      responses:
        "200": { description: Activity accepted. }
        "400": { description: Invalid heartbeat. }
        "401": { description: Sign-in required. }
        "403": { description: Invalid origin. }
  /api/usage/view:
    post:
      description: Same-origin authenticated view-open event. Unknown views are rejected; no arbitrary payload is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [view]
              properties:
                view:
                  {
                    type: string,
                    enum: [live, journeys, logs, alerts, analytics, calls, notifications, app-usage],
                  }
      responses:
        "200": { description: View event accepted. }
        "400": { description: Invalid view. }
        "401": { description: Sign-in required. }
        "403": { description: Invalid origin. }
  /api/analytics/overview:
    get:
      description: Requires the current app_users.is_advanced database flag. Aggregates all app viewers. Returns totals, accounts, sessions, daily UTC traffic, top_users ranked by interaction_requests, routes, services, views and process-local pending_records/dropped_records/write_failures counters. Usage is eventually consistent and does not include direct browser map-tile calls.
      parameters:
        - { $ref: "#/components/parameters/AnalyticsDays" }
      responses:
        "200": { description: Analytics overview. }
        "400": { description: Invalid filters. }
        "401": { description: Sign-in required. }
        "403": { description: Advanced access required. }
        "503": { description: Database temporarily unavailable. }
  /api/analytics/users:
    get:
      description: Requires the current app_users.is_advanced database flag. All registered app viewers, newest created first. Includes id, email, display_name, is_advanced, created_at, last_login_at, last_seen_at and request count within the selected period. Never returns Google subjects or session token hashes.
      parameters:
        - { $ref: "#/components/parameters/AnalyticsDays" }
        - { $ref: "#/components/parameters/AnalyticsCursor" }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsPage" }
        "401": { description: Sign-in required. }
        "403": { description: Advanced access required. }
        "409": { description: Cursor expired or filters changed. }
  /api/analytics/sessions:
    get:
      description: Requires the current app_users.is_advanced database flag. Sessions started in the period, ordered by started_at and id descending. Includes user context, coarse browser/OS/device, activity/expiry/logout timestamps and lifetime API request count. A session with no logout may already be expired; expiry is authoritative.
      parameters:
        - { $ref: "#/components/parameters/AnalyticsDays" }
        - { $ref: "#/components/parameters/AnalyticsUser" }
        - { $ref: "#/components/parameters/AnalyticsCursor" }
      responses:
        "200": { $ref: "#/components/responses/AnalyticsPage" }
        "401": { description: Sign-in required. }
        "403": { description: Advanced access required. }
        "409": { description: Cursor expired or filters changed. }
  /api/analytics/requests:
    get:
      description: Requires the current app_users.is_advanced database flag. Newest request timestamp/id first. Rows include normalized method/route, service, app_view, is_background, status_code, duration_ms, response_bytes, occurred_at and actor IDs/email. Query values, bodies, raw headers, IPs and credentials are excluded. Anonymous API requests have null user/session IDs.
      parameters:
        - { $ref: "#/components/parameters/AnalyticsDays" }
        - { $ref: "#/components/parameters/AnalyticsUser" }
        - { $ref: "#/components/parameters/AnalyticsCursor" }
        - name: session_id
          in: query
          schema: { type: string, format: uuid }
        - name: service
          in: query
          schema:
            type: string
            enum:
              [
                usage,
                analytics,
                place_names,
                email,
                live_locations,
                journeys,
                activity_logs,
                calls,
                notifications,
                app_usage,
                devices,
                authentication,
                other,
              ]
      responses:
        "200": { $ref: "#/components/responses/AnalyticsPage" }
        "400": { description: Invalid filters. }
        "401": { description: Sign-in required. }
        "403": { description: Advanced access required. }
        "409": { description: Cursor expired or filters changed. }
  /api/history/{kind}:
    get:
      description: Read-only phone history for currently authorized and unlocked devices; advanced users bypass device email/PIN restrictions. Pages contain at most 20 rows ordered by recorded_at descending then event_id descending at a fixed database snapshot. Calls use the latest observed revision per device/call_id; app usage uses the latest per device/source_key/event_type. Revision selection happens before search/type filtering. Notification lifecycle observations and revisions are retained. Daily totals are Android intervals and must not be added to session times; foreground, visible and service metrics overlap. Ordinary viewers do not need the advanced flag after unlocking an email-linked device.
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [calls, notifications, app-usage] }
        - { $ref: "#/components/parameters/Devices" }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/Timezone" }
        - name: event_type
          in: query
          description: Calls use Android type codes 1 through 7; notifications use active/posted/removed; app-usage uses daily/session. Omit for all types.
          schema: { type: string }
        - name: q
          in: query
          description: Case-insensitive literal substring in contact names/numbers, notification text/app names, or app usage names/packages. No regular expressions or SQL wildcards.
          schema: { type: string, maxLength: 200 }
        - name: cursor
          in: query
          description: Signed opaque cursor bound to viewer, full authorized device scope, kind and filters. Uses the configured event cursor TTL (four minutes by default).
          schema: { type: string, maxLength: 4096 }
      responses:
        "200":
          description: One history page with original metadata, separate event/observation/receipt times and optional page replay/next cursors. Empty device selection returns an empty array.
          content:
            application/json:
              schema:
                type: object
                required: [items, page_cursor, next_cursor, has_more, as_of, expires_at]
                properties:
                  items:
                    type: array
                    maxItems: 20
                    items: { $ref: "#/components/schemas/DeviceHistoryRecord" }
                  page_cursor: { type: [string, "null"] }
                  next_cursor: { type: [string, "null"] }
                  has_more: { type: boolean }
                  as_of: { type: string, format: date-time }
                  expires_at: { type: string, format: date-time }
        "400":
          description: Invalid/repeated filters, unsupported type or tampered cursor.
        "401": { description: Sign-in required. }
        "403": { description: access_denied for a device outside the current viewer's scope or device_locked when a selected device requires its PIN. }
        "409": { description: Cursor expired or viewer/device/filter scope changed. }
        "503": { description: Data service unavailable. history_unavailable includes a safe table/SELECT-access setup hint and no internal error details. }
  /api/devices:
    get:
      description: Ordinary viewers receive basic metadata for their email-linked non-revoked devices, including locked devices. Advanced viewers receive every registered device with locked=false and pin_setup_required=false. Registration hashes, tracking_email and upload tokens are never returned. Device history endpoints independently enforce current ownership, role and unlock state on every request.
      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: Authorised registry metadata with per-device locked and pin_setup_required flags. Names can repeat; device_id is the identity. An empty registry is valid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    {
                      type: array,
                      items: { $ref: "#/components/schemas/Device" },
                    }
        "400": { description: Search text exceeds 200 characters. }
        "401": { $ref: "#/components/responses/Error" }
        "503":
          description: Device registry, session verification or durable device-access state is unavailable.
  /api/devices/unlock:
    post:
      description: >-
        Same-origin application/json request to unlock one email-linked device
        using its existing mobile-app PIN. Leading zeroes must be preserved.
        Unlocks are durable and bound to the app session, device, and an HMAC
        version of the current registered email and PIN hash; ownership or PIN-hash
        changes invalidate remembered access on subsequent requests. Advanced
        viewers and already unlocked devices return success without PIN verification.
        Verification reserves at most five attempts per device in a 15-minute
        window shared across accounts and sessions. PIN enrollment, change and
        recovery are not implemented by this API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_id, pin]
              properties:
                device_id: { type: string, format: uuid }
                pin:
                  type: string
                  minLength: 4
                  maxLength: 4
                  pattern: '^[0-9]{4}$'
                  description: Four ASCII digits as a string, including any leading zeroes.
      responses:
        "200":
          description: This device is unlocked for the current app session.
          content:
            application/json:
              schema:
                type: object
                required: [device_id, unlocked]
                properties:
                  device_id: { type: string, format: uuid }
                  unlocked: { type: boolean, const: true }
        "400":
          description: invalid_pin; malformed JSON, unknown fields, invalid device ID or PIN other than exactly four ASCII digits as a string.
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: access_denied for a device outside the current account's scope, incorrect_pin for failed verification, pin_setup_required for missing mobile PIN enrollment, or origin_rejected for a different origin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415": { description: json_required; application/json content type is required. }
        "429":
          description: pin_rate_limited; the device's five-attempt window is exhausted.
          headers:
            Retry-After:
              description: Wait before retrying, in seconds.
              schema: { type: integer, const: 900 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: pin_verification_unavailable when the existing registration PIN_PEPPER is not configured, or durable session/device-access storage is unavailable.
  /api/events:
    get:
      description: Newest recorded event first. Every selected device must currently be authorized and unlocked; advanced users bypass the email/PIN restriction. A filter/access change requires a new cursor chain. Exactly 20 maximum rows across all selected devices, including no-fix events. Repeated parameters are rejected.
      parameters:
        - { $ref: "#/components/parameters/Devices" }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/Timezone" }
        - {
            name: limit,
            in: query,
            schema: { type: integer, const: 20, default: 20 },
          }
        - { name: cursor, in: query, schema: { type: string, maxLength: 4096 } }
        - {
            name: reasons,
            in: query,
            description: Comma-separated stored reason values.,
            schema: { type: string },
          }
        - {
            name: severity,
            in: query,
            description: Comma-separated attention/positive/limited/neutral.,
            schema: { type: string },
          }
        - {
            name: outcomes,
            in: query,
            description: Comma-separated execution outcomes; not_recorded includes null.,
            schema: { type: string },
          }
        - {
            name: statuses,
            in: query,
            description: Comma-separated fresh/last_known/unavailable/disabled.,
            schema: { type: string },
          }
        - {
            name: transports,
            in: query,
            description: Comma-separated unknown/none/wifi/cellular/other.,
            schema: { type: string },
          }
      responses:
        "200":
          description: One cursor page. A final page can contain fewer than 20 records. next_cursor is null at the end.
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    items,
                    page_cursor,
                    next_cursor,
                    has_more,
                    as_of,
                    expires_at,
                    order,
                  ]
                properties:
                  items:
                    {
                      type: array,
                      maxItems: 20,
                      items: { $ref: "#/components/schemas/Event" },
                    }
                  page_cursor:
                    {
                      type: [string, "null"],
                      description: "Replays this exact page at the same snapshot, including the original first page.",
                    }
                  next_cursor: { type: [string, "null"] }
                  has_more: { type: boolean }
                  as_of: { type: string, format: date-time }
                  expires_at: { type: string, format: date-time }
                  order:
                    { type: string, const: "recorded_at_desc,event_id_desc" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403":
          description: access_denied for a device outside the current account's scope or device_locked for a selected device requiring its PIN.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: cursor_expired or cursor_scope_changed. Explicitly restart at the first 20; never append the restarted page to the old list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/events/changes:
    get:
      parameters:
        - { $ref: "#/components/parameters/Devices" }
        - {
            name: as_of,
            in: query,
            required: true,
            schema: { type: string, format: date-time },
          }
      responses:
        "200":
          {
            description: "A boolean available indicates newly received events for authorised selected devices; this does not modify the current pagination snapshot.",
          }
  /api/locations/latest:
    get:
      description: Requires current access and PIN unlock for every selected device; advanced users bypass the email/PIN restriction.
      parameters:
        - { $ref: "#/components/parameters/Devices" }
      responses:
        "200":
          {
            description: "Per-device latest received event, latest observed event, latest captured fix and explicitly observed airplane state/time. These can refer to different records.",
          }
  /api/locations/history:
    get:
      description: Requires current access and PIN unlock for every selected device; advanced users bypass the email/PIN restriction.
      parameters:
        - { $ref: "#/components/parameters/Devices" }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/Timezone" }
      responses:
        "200":
          {
            description: "Bounded map observations ordered by capture time, total/returned counts, simplified flag and resolution. More than 5000 observations uses explicitly labelled daily representative observations. Focused-day interruption boundaries prevent misleading links. This is independent of log pagination.",
          }
  /api/activity/summary:
    get:
      description: Requires current access and PIN unlock for every selected device; advanced users bypass the email/PIN restriction.
      parameters:
        - { $ref: "#/components/parameters/Devices" }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - { $ref: "#/components/parameters/Timezone" }
      responses:
        "200":
          {
            description: "Counts of events, positions and attention events grouped by local calendar day in the requested timezone.",
          }
  /api/places/resolve:
    post:
      description: Same-origin only. Accepts event IDs belonging to currently authorized and unlocked devices instead of arbitrary coordinates; advanced users bypass the email/PIN restriction. Returns cached results or pending/unavailable/not_configured/no_fix/busy statuses. Slow provider work is queued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [event_ids]
              properties:
                event_ids:
                  {
                    type: array,
                    maxItems: 100,
                    items: { type: string, format: uuid },
                  }
                refresh:
                  {
                    type: boolean,
                    default: false,
                    description: Explicit refresh is limited to one event and coalesced/rate limited.,
                  }
      responses:
        "200":
          {
            description: "items maps each event ID to status and an optional provider-labelled Place. No-fix records are never geocoded.",
          }
        "403": { $ref: "#/components/responses/Error" }
components:
  responses:
    AnalyticsPage:
      description: Up to 20 analytics records. Numeric database aggregate fields may be serialized as numbers or decimal strings.
      content:
        application/json:
          schema:
            type: object
            required: [items, has_more, next_cursor]
            properties:
              items:
                type: array
                maxItems: 20
                items: { type: object, additionalProperties: true }
              has_more: { type: boolean }
              next_cursor: { type: [string, "null"] }
    Error:
      description: Stable error code and safe user-facing message. No internal SQL, credentials or coordinates are included. Device reads return access_denied for an unavailable device or device_locked when PIN unlock is required.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: lk_session
      description: Encrypted HTTP-only SameSite=Lax persistent cookie, Secure on HTTPS. Automatic 400-day inactivity lifetime renewed at most daily. Its hashed token is checked against durable session expiry/revocation, account disabled state and the current advanced flag on every authenticated request; the original Google token is not needed for return visits.
  parameters:
    AnalyticsDays:
      name: days
      in: query
      description: UTC calendar days including today. Dashboard presets are 7/30/90.
      schema: { type: integer, minimum: 1, maximum: 90, default: 7 }
    AnalyticsUser:
      name: user_id
      in: query
      schema: { type: string, format: uuid }
    AnalyticsCursor:
      name: cursor
      in: query
      description: Opaque signed keyset cursor. Expires after 15 minutes and binds the list and filters. Lists are eventually consistent.
      schema: { type: string, maxLength: 1000 }
    Devices:
      {
        name: device_ids,
        in: query,
        description: Comma-separated UUIDs with current viewer access and PIN unlock; maximum 20. Advanced users bypass email/PIN restrictions. Empty selection returns no rows.,
        schema: { type: string },
      }
    From:
      {
        name: from,
        in: query,
        required: true,
        description: UTC inclusive bound inside the last 90 local calendar days.,
        schema: { type: string, format: date-time },
      }
    To:
      {
        name: to,
        in: query,
        required: true,
        description: "UTC exclusive bound, at most the next local midnight.",
        schema: { type: string, format: date-time },
      }
    Timezone:
      {
        name: timezone,
        in: query,
        schema: { type: string, default: Asia/Kolkata },
      }
  schemas:
    DeviceHistoryRecord:
      type: object
      required: [event_id, device_id, recorded_at, observed_at, received_at, event_type, fields]
      properties:
        event_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        recorded_at: { type: string, format: date-time, description: "Call start, notification event or usage interval/session start." }
        observed_at: { type: string, format: date-time, description: Phone observation time retained from the uploaded revision. }
        received_at: { type: string, format: date-time, description: Database receipt time; distinct from phone observation. }
        event_type: { type: string }
        source_package: { type: string }
        call_id: { type: string, format: uuid }
        source_id: { type: string }
        source_key: { type: string }
        fields:
          type: object
          additionalProperties: { type: [string, "null"] }
          description: Uploaded phone metadata; omitted or null values remain unknown. Call durations are seconds; usage durations are milliseconds. Notification messages is JSON text, and text_lines is newline-separated text. Metadata truncation markers are preserved. No URI contents are fetched.
    Error:
      type: object
      required: [code, error]
      properties:
        code: { type: string }
        error: { type: string }
    Device:
      type: object
      required: [device_id, device_name, detected_device_name, label, revoked, locked, pin_setup_required]
      properties:
        device_id: { type: string, format: uuid }
        device_name: { type: string }
        detected_device_name: { type: string }
        label: { type: string }
        revoked:
          {
            type: boolean,
            description: Upload registration status. Ordinary viewers do not discover revoked devices.,
          }
        locked:
          type: boolean
          description: Device history requires PIN unlock in this app session. Always false for advanced users.
        pin_setup_required:
          type: boolean
          description: Registration has no PIN hash; complete existing mobile-app setup before ordinary access. Always false for advanced users.
    Event:
      type: object
      required:
        [
          event_id,
          device_id,
          recorded_at,
          received_at,
          reason,
          location_status,
          severity,
          title,
        ]
      properties:
        event_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        recorded_at: { type: string, format: date-time }
        received_at: { type: string, format: date-time }
        executed_at: { type: [string, "null"], format: date-time }
        scheduled_for: { type: [string, "null"], format: date-time }
        captured_at: { type: [string, "null"], format: date-time }
        execution_status:
          {
            type: [string, "null"],
            enum:
              [
                completed,
                unavailable,
                disabled,
                permission_missing,
                missed,
                cancelled,
                null,
              ],
          }
        reason: { type: string }
        location_status:
          { type: string, enum: [fresh, last_known, unavailable, disabled] }
        network_transport:
          { type: string, enum: [unknown, none, wifi, cellular, other] }
        latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
        accuracy_m: { type: [number, "null"] }
        battery_percent: { type: [integer, "null"], minimum: 0, maximum: 100 }
        fix_age_ms: { type: [integer, "null"] }
        is_mock: { type: boolean }
        permission_accuracy: { type: string }
        accuracy_mode: { type: string }
        airplane_mode_enabled:
          {
            type: [boolean, "null"],
            description: Explicit observation or an explicit on/off reason; unknown remains null.,
          }
